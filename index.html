<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ef5b3f"><title>省心比价</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--orange:#ef5b3f;--ink:#202427;--muted:#72777b;--bg:#f5f4f1;--card:#fff;--green:#14845b;--line:#e7e4df}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"HarmonyOS Sans SC","Noto Sans CJK SC",sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:90px}.hero{padding:30px 20px 22px;background:linear-gradient(135deg,#ef5b3f,#ff8a4e);color:white;border-radius:0 0 28px 28px}.hero small{opacity:.82}.hero h1{margin:5px 0;font-size:29px}.hero p{margin:0;opacity:.9;font-size:13px}.tabs{display:flex;gap:8px;padding:14px 16px;position:sticky;top:0;z-index:5;background:rgba(245,244,241,.94);backdrop-filter:blur(12px)}button{border:0;border-radius:11px;padding:11px 14px;font-weight:700;background:var(--orange);color:white;font-size:14px}.tab{flex:1;background:white;color:var(--muted);border:1px solid var(--line)}.tab.active{color:var(--orange);border-color:#ffc1ae;background:#fff7f4}.page{display:none;padding:0 16px}.page.active{display:block}.product,.plan,.history-card,.summary{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:13px;box-shadow:0 8px 25px rgba(55,43,35,.05)}.product h2,.section-title{margin:0 0 12px;font-size:17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:grid;gap:5px;font-size:12px;color:var(--muted)}input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;background:#fff;font:inherit;color:var(--ink)}.plan.best{border:2px solid var(--green);box-shadow:0 10px 30px rgba(20,132,91,.12)}.plan-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.plan-head input{font-size:17px;font-weight:800;border:0;padding:2px 0}.rank{font-size:11px;border-radius:99px;padding:5px 9px;background:#e5f5ee;color:var(--green);white-space:nowrap}.subhead{grid-column:1/-1;font-size:12px;font-weight:800;color:var(--orange);border-top:1px dashed var(--line);padding-top:11px;margin-top:3px}.result{margin-top:14px;background:#f8f7f4;border-radius:12px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.result strong{display:block;font-size:17px}.result span{font-size:10px;color:var(--muted)}.warn{font-size:11px;color:#9c5a00;margin-top:8px}.actions{display:flex;gap:9px;margin:14px 0}.actions button{flex:1}.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.danger{background:transparent;color:#b33;padding:5px}.summary{background:#202427;color:white}.summary h3{margin:0 0 8px}.summary .winner{font-size:23px;font-weight:800;color:#ffd09f}.summary p{font-size:13px;color:#d8dbdc}.history-card{display:grid;gap:8px}.history-head{display:flex;justify-content:space-between}.history-card h3{margin:0;font-size:16px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:#f3f0eb;border-radius:8px;padding:6px 8px;font-size:11px}.empty{text-align:center;color:var(--muted);padding:40px 10px}.bottom{position:fixed;bottom:0;left:0;right:0;padding:12px max(16px,calc((100vw - 688px)/2));background:rgba(255,255,255,.95);border-top:1px solid var(--line);display:flex;gap:9px;z-index:9}.bottom button{flex:1}.footnote{font-size:11px;color:var(--muted);line-height:1.6;margin:15px 4px}@media(max-width:380px){.grid{grid-template-columns:1fr}.subhead{grid-column:1}.result{grid-template-columns:1fr}.hero h1{font-size:25px}}</style></head><body><div class="app"><header class="hero"><small>算清每一份优惠</small><h1>省心比价</h1><p>满减 · 赠品 · 返利 · 历史到手价，一次算清</p></header><nav class="tabs"><button class="tab active" data-page="compare">本次比价</button><button class="tab" data-page="history">购买历史</button><button class="tab" data-page="backup">数据备份</button></nav><main>
<section id="compare" class="page active"><article class="product"><h2>要买什么？</h2><div class="grid"><label>商品名称<input id="productName" placeholder="例如：洗衣液"></label><label>比较单位<select id="unit"><option value="克">克</option><option value="毫升">毫升</option><option value="个">个</option><option value="片">片</option></select></label></div></article><div id="plans"></div><div id="summary"></div><p class="footnote">预计返利尚未到账，可能因退货、渠道或结算规则失效，因此会单独显示返利前付款和返利后预计净成本。</p></section>
<section id="history" class="page"><div class="product"><h2>往年到手价</h2><label>按商品筛选<input id="historySearch" placeholder="输入商品名称"></label></div><div id="historyList"></div></section>
<section id="backup" class="page"><article class="product"><h2>数据只存手机本地</h2><p class="footnote">更换浏览器、清理浏览器数据或换手机前，请先导出备份。恢复备份会合并历史购买记录。</p><div class="actions"><button id="export">导出备份</button><label style="flex:1"><span></span><button type="button" class="secondary" id="importTrigger">恢复备份</button><input hidden type="file" id="importFile" accept="application/json"></label></div></article></section>
</main><div class="bottom"><button class="secondary" id="addPlan">＋ 增加平台</button><button id="savePurchase">保存本次购买</button></div></div><script>
const KEY='smartPriceCompare.v1';const defaultNames=['美团','京东','淘宝'];let db=JSON.parse(localStorage.getItem(KEY)||'{"history":[]}');let plans=defaultNames.map(makePlan);
function makePlan(name='新平台'){return{id:Date.now()+Math.random(),name,price:0,qty:1,size:0,full:0,coupon:0,giftQty:0,giftSize:0,giftValue:0,cashExpected:0}}
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],num=v=>Number(v)||0,money=v=>'¥'+num(v).toFixed(2),esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function calc(p){const gross=p.price*p.qty,pay=Math.max(0,gross-p.full-p.coupon),giftAdjusted=Math.max(0,pay-p.giftValue),estimated=Math.max(0,giftAdjusted-p.cashExpected),amount=p.qty*p.size+p.giftQty*p.giftSize;return{gross,pay,giftAdjusted,estimated,amount,unitEst:amount?estimated/amount:Infinity}}
function field(id,label,type='number',step='0.01'){return`<label>${label}<input data-field="${id}" type="${type}" ${type==='number'?`min="0" step="${step}" inputmode="decimal"`:''}></label>`}
function render(){const ranked=[...plans].sort((a,b)=>calc(a).unitEst-calc(b).unitEst);$('#plans').innerHTML=plans.map((p,i)=>{const c=calc(p),best=ranked[0]===p&&Number.isFinite(c.unitEst);return`<article class="plan ${best?'best':''}" data-id="${p.id}"><div class="plan-head"><input data-field="name" value="${esc(p.name)}" aria-label="平台名称">${best?'<span class="rank">预计克价最低</span>':''}${plans.length>3?'<button class="danger" data-remove>删除</button>':''}</div><div class="grid">${field('price','商品单价（元）')}${field('qty','购买件数','number','1')}${field('size','每件净含量')}${field('full','满减金额')}${field('coupon','优惠券')}<div class="subhead">赠品</div>${field('giftQty','同款赠品件数','number','1')}${field('giftSize','每件赠品含量')}${field('giftValue','其他赠品折算价值')}<div class="subhead">返利</div>${field('cashExpected','预计返利')}</div><div class="result"><div><strong>${money(c.pay)}</strong><span>优惠后付款</span></div><div><strong>${money(c.estimated)}</strong><span>预计净成本</span></div><div><strong>${Number.isFinite(c.unitEst)?c.unitEst.toFixed(4):'—'}</strong><span>预计每${$('#unit').value}价格</span></div></div>${p.cashExpected?'<div class="warn">预计返利 '+money(p.cashExpected)+' 尚未到账，请留意结算。</div>':''}</article>`}).join('');plans.forEach(p=>{const card=document.querySelector(`[data-id="${p.id}"]`);Object.keys(p).forEach(k=>{const e=card.querySelector(`[data-field="${k}"]`);if(e)e.value=p[k]})});renderSummary()}
function renderSummary(){const valid=plans.map(p=>({p,c:calc(p)})).filter(x=>Number.isFinite(x.c.unitEst)).sort((a,b)=>a.c.unitEst-b.c.unitEst);if(!valid.length){$('#summary').innerHTML='';return}const w=valid[0],product=$('#productName').value||'该商品';const hist=db.history.filter(h=>h.product.trim()===product.trim()&&h.unit===$('#unit').value),low=hist.length?Math.min(...hist.map(h=>h.unitPrice)):null;let msg=low==null?'暂无同款历史购买记录。':w.c.unitEst<=low?`比历史最低价还低 ${((low-w.c.unitEst)/low*100).toFixed(1)}%。`:`比历史最低价高 ${((w.c.unitEst-low)/low*100).toFixed(1)}%。`;$('#summary').innerHTML=`<article class="summary"><h3>当前推荐</h3><div class="winner">${esc(w.p.name)}</div><p>${esc(product)}预计每${$('#unit').value}${w.c.unitEst.toFixed(4)}元。${msg}</p></article>`}
$('#plans').addEventListener('input',e=>{const card=e.target.closest('.plan');if(!card)return;const p=plans.find(x=>String(x.id)===card.dataset.id),k=e.target.dataset.field;p[k]=k==='name'?e.target.value:num(e.target.value);renderSummary()});$('#plans').addEventListener('change',render);$('#plans').addEventListener('click',e=>{if(e.target.hasAttribute('data-remove')){plans=plans.filter(x=>String(x.id)!==e.target.closest('.plan').dataset.id);render()}});
$('#addPlan').onclick=()=>{plans.push(makePlan());render()};$('#unit').onchange=render;$('#productName').oninput=renderSummary;
$('#savePurchase').onclick=()=>{const product=$('#productName').value.trim();if(!product)return alert('请先填写商品名称');const valid=plans.map(p=>({p,c:calc(p)})).filter(x=>Number.isFinite(x.c.unitEst)).sort((a,b)=>a.c.unitEst-b.c.unitEst);if(!valid.length)return alert('请至少填写一个平台的价格和净含量');const x=valid[0];db.history.unshift({id:Date.now(),date:new Date().toISOString().slice(0,10),product,unit:$('#unit').value,platform:x.p.name,paid:x.c.pay,net:x.c.estimated,unitPrice:x.c.unitEst,amount:x.c.amount,gifts:x.p.giftQty*x.p.giftSize,cashback:x.p.cashExpected});persist();alert('已按当前最划算方案保存：'+x.p.name);renderHistory()};
function persist(){localStorage.setItem(KEY,JSON.stringify(db))}function renderHistory(){const q=$('#historySearch').value.trim();const hs=db.history.filter(h=>!q||h.product.includes(q));$('#historyList').innerHTML=hs.length?hs.map(h=>`<article class="history-card"><div class="history-head"><div><h3>${esc(h.product)}</h3><small>${h.date} · ${esc(h.platform)}</small></div><button class="danger" data-hdel="${h.id}">删除</button></div><div class="chips"><span class="chip">付款 ${money(h.paid)}</span><span class="chip">返利后 ${money(h.net)}</span><span class="chip">${h.unitPrice.toFixed(4)} 元/${esc(h.unit)}</span><span class="chip">赠品 ${h.gifts||0}${esc(h.unit)}</span></div></article>`).join(''):'<div class="empty">还没有购买历史</div>'}
$('#historyList').onclick=e=>{if(e.target.dataset.hdel&&confirm('删除这条记录？')){db.history=db.history.filter(h=>String(h.id)!==e.target.dataset.hdel);persist();renderHistory()}};$('#historySearch').oninput=renderHistory;
$$('.tab').forEach(b=>b.onclick=()=>{$$('.tab,.page').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#'+b.dataset.page).classList.add('active');if(b.dataset.page==='history')renderHistory()});
$('#export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='省心比价备份-'+new Date().toISOString().slice(0,10)+'.json';a.click()};$('#importTrigger').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());db.history=[...(x.history||[]),...db.history].filter((v,i,a)=>a.findIndex(t=>t.id===v.id)===i);persist();renderHistory();alert('恢复完成')}catch(_){alert('备份文件无法读取')}};render();renderHistory();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
