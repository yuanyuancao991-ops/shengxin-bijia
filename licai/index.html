kup" class="backup"><article class="portfolio"><div class="head"><div><h2>数据备份</h2><small>数据默认只保存在当前手机浏览器</small></div></div><div class="actions" style="margin-top:16px"><button id="exportBtn">导出备份</button><button id="importBtn" class="secondary">恢复备份</button><input id="importFile" type="file" accept="application/json" hidden></div></article></section></main><div class="bottom"><button id="newProduct">＋ 新建理财</button></div></div>
<dialog id="dlg"><form id="form"><div class="dialog-head"><h3 id="dlgTitle"></h3><button type="button" class="x" data-close>×</button></div><div id="fields" class="form-grid"></div><div class="dialog-actions"><button type="button" class="secondary" data-close>取消</button><button type="submit">保存</button></div></form></dialog>
<script>
const KEY='licai-helper.v1';let db=JSON.parse(localStorage.getItem(KEY)||'{"products":[]}'),mode='',pid='';const $=s=>document.querySelector(s),money=n=>'¥'+(Number(n)||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}),pct=n=>Number.isFinite(n)?(n*100).toFixed(2)+'%':'—',day=d=>new Date(d+'T00:00:00'),iso=d=>d.toISOString().slice(0,10),esc=s=>String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(db));render()}function product(id){return db.products.find(x=>x.id===id)}function days(a,b){return Math.max(0,(day(b)-day(a))/86400000)}function netPrincipal(p,date='9999-12-31'){return p.flows.filter(x=>x.date<=date).reduce((s,x)=>s+(x.type==='buy'?x.amount:-x.amount),0)}
function dietz(p,startDate,endDate,startValue,endValue){const D=days(startDate,endDate);if(!D||startValue<0)return NaN;const fs=p.flows.filter(x=>x.date>startDate&&x.date<=endDate).map(x=>({...x,cf:x.type==='buy'?x.amount:-x.amount}));const cf=fs.reduce((s,x)=>s+x.cf,0),weighted=fs.reduce((s,x)=>s+x.cf*(days(x.date,endDate)/D),0),den=startValue+weighted;return den>0?(endValue-startValue-cf)/den:NaN}
function latest(p){return [...p.snapshots].sort((a,b)=>b.date.localeCompare(a.date))[0]}function period(p,n){const end=latest(p);if(!end)return NaN;const target=new Date(day(end.date));target.setDate(target.getDate()-n);const t=iso(target),start=[...p.snapshots].filter(x=>x.date<=t).sort((a,b)=>b.date.localeCompare(a.date))[0];if(!start)return NaN;return dietz(p,start.date,end.date,start.value,end.value)}
function stats(p){const end=latest(p),principal=netPrincipal(p),earn=end?end.earnings:0;if(!end)return{principal,earn,month:NaN,m1:NaN,m3:NaN,annual:NaN};const first=[...p.flows].sort((a,b)=>a.date.localeCompare(b.date))[0],m1=period(p,30),m3=period(p,90);let all=NaN,span=0;if(first){const start=new Date(day(first.date));start.setDate(start.getDate()-1);span=days(iso(start),end.date);all=dietz(p,iso(start),end.date,0,end.value)}const month=Number.isFinite(all)&&all>-1&&span>0?Math.pow(1+all,30/span)-1:NaN;const base=Number.isFinite(m3)?m3:all,baseDays=Number.isFinite(m3)?90:span,annual=Number.isFinite(base)&&base>-1&&baseDays>0?Math.pow(1+base,365/baseDays)-1:NaN;return{principal,earn,month,m1,m3,annual,end}}
function render(){if(!db.products.length){$('#list').innerHTML='<div class="empty">还没有理财记录<br><br>点击下方“新建理财”开始</div>';return}$('#list').innerHTML=db.products.map(p=>{const s=stats(p),events=[...p.flows.map(x=>({...x,kind:'flow'})),...p.snapshots.map(x=>({...x,kind:'snap'}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);return`<article class="portfolio"><div class="head"><div><h2>${esc(p.name)}</h2><small>${p.flows.length} 笔资金变动 · ${p.snapshots.length} 个收益快照</small></div><button class="danger" data-del="${p.id}">删除</button></div><div class="metrics"><div class="metric"><span>当前累计本金</span><strong>${money(s.principal)}</strong></div><div class="metric"><span>最新累计收益</span><strong>${money(s.earn)}</strong></div><div class="metric"><span>持有期月平均收益率</span><strong>${pct(s.month)}</strong></div><div class="metric"><span>近1月收益率</span><strong>${pct(s.m1)}</strong></div><div class="metric"><span>近3月收益率</span><strong>${pct(s.m3)}</strong></div><div class="metric primary"><span>预测年化率</span><strong>${pct(s.annual)}</strong></div></div><div class="actions"><button data-buy="${p.id}">＋ 买入/追加</button><button data-redeem="${p.id}" class="secondary">－ 赎回</button><button data-snap="${p.id}" class="secondary">更新收益</button></div><div class="timeline">${events.length?events.map(x=>x.kind==='flow'?`<div class="row"><span>${x.date} <b class="pill ${x.type}">${x.type==='buy'?'买入':'赎回'}</b></span><strong>${money(x.amount)}</strong></div>`:`<div class="row"><span>${x.date} <b class="pill">收益快照</b></span><strong>累计收益 ${money(x.earnings)}</strong></div>`).join(''):'<div class="row"><span>暂无记录</span></div>'}</div></article>`}).join('')}
function openDialog(m,id=''){mode=m;pid=id;const today=iso(new Date());if(m==='product'){$('#dlgTitle').textContent='新建理财';$('#fields').innerHTML='<label class="full">理财名称<input name="name" required placeholder="例如：稳健理财A"></label><label>首次购买日期<input name="date" type="date" value="'+today+'" required></label><label>首次买入本金<input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required></label>'}else if(m==='buy'||m==='redeem'){$('#dlgTitle').textContent=m==='buy'?'买入或追加本金':'赎回或转出';$('#fields').innerHTML='<label>日期<input name="date" type="date" value="'+today+'" required></label><label>金额<input name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required></label>'}else{const p=product(id),np=netPrincipal(p);$('#dlgTitle').textContent='更新收益快照';$('#fields').innerHTML='<label>记录日期<input name="date" type="date" value="'+today+'" required></label><label>当前累计收益<input name="earnings" type="number" step="0.01" inputmode="decimal" required></label><label class="full">当前持有总金额（可选）<input name="value" type="number" min="0" step="0.01" inputmode="decimal" placeholder="不填则按当前本金＋累计收益计算"></label><div class="hint">当前系统累计本金为 '+money(np)+'。为了准确计算近1月和近3月，建议每月固定一天记录一次。</div>'}$('#dlg').showModal()}
$('#form').onsubmit=e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(mode==='product'){const id=Date.now().toString(36);db.products.push({id,name:f.name.trim(),flows:[{id:Date.now(),date:f.date,type:'buy',amount:+f.amount}],snapshots:[]})}else if(mode==='buy'||mode==='redeem'){product(pid).flows.push({id:Date.now(),date:f.date,type:mode,amount:+f.amount})}else{const p=product(pid),np=netPrincipal(p,f.date),earnings=+f.earnings,value=f.value===''?np+earnings:+f.value;p.snapshots=p.snapshots.filter(x=>x.date!==f.date);p.snapshots.push({id:Date.now(),date:f.date,earnings,value})}$('#dlg').close();e.target.reset();save()};
document.addEventListener('click',e=>{if(e.target.hasAttribute('data-close'))$('#dlg').close();if(e.target.dataset.buy)openDialog('buy',e.target.dataset.buy);if(e.target.dataset.redeem)openDialog('redeem',e.target.dataset.redeem);if(e.target.dataset.snap)openDialog('snap',e.target.dataset.snap);if(e.target.dataset.del&&confirm('确定删除这项理财及全部记录吗？')){db.products=db.products.filter(x=>x.id!==e.target.dataset.del);save()}});$('#newProduct').onclick=()=>openDialog('product');$('#homeBtn').onclick=()=>{$('#home').classList.remove('hidden');$('#backup').classList.remove('active')};$('#backupBtn').onclick=()=>{$('#home').classList.add('hidden');$('#backup').classList.add('active')};$('#exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='理财收益助手备份-'+iso(new Date())+'.json';a.click()};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.products))throw 0;if(confirm('恢复备份将覆盖当前数据，是否继续？')){db=x;save();alert('恢复完成')}}catch(_){alert('备份文件无法读取')}};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');

<script>
(()=>{

document.body.insertAdjacentHTML('beforeend',`<dialog id="ocrDlg"><form id="ocrForm"><div class="dialog-head"><h3>截图识别导入</h3><button type="button" class="x" data-ocr-close>×</button></div><div class="form-grid"><label class="full">选择银行理财截图<input id="ocrFile" type="file" accept="image/*" required></label><img id="ocrPreview" class="ocr-preview full" alt="截图预览"><div id="ocrStatus" class="hint">截图仅在当前浏览器中识别。请选择清晰、完整的产品详情或持仓页面。</div><label class="full">导入到<select name="target" id="ocrTarget"><option value="new">新建理财项目</option></select></label><label class="full">理财名称<input name="name" placeholder="识别后可修改" required></label><label>数据日期<input name="date" type="date" required></label><label>当前累计本金<input name="principal" type="number" min="0" step="0.01" inputmode="decimal" required></label><label>当前累计收益<input name="earnings" type="number" step="0.01" inputmode="decimal" required></label><label>当前持有总金额（可选）<input name="value" type="number" min="0" step="0.01" inputmode="decimal"></label><details class="full"><summary>查看识别文字</summary><textarea id="ocrText" readonly style="width:100%;min-height:120px;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:10px"></textarea></details></div><div class="dialog-actions"><button type="button" class="secondary" data-ocr-close>取消</button><button type="submit">确认导入</button></div></form></dialog>`);
const od=document.querySelector('#ocrDlg'),of=document.querySelector('#ocrForm'),status=document.querySelector('#ocrStatus'),preview=document.querySelector('#ocrPreview'),file=document.querySelector('#ocrFile'),target=document.querySelector('#ocrTarget');
function amountNear(text,words){for(const word of words){const i=text.indexOf(word);if(i>=0){const part=text.slice(i+word.length,i+word.length+45),m=part.match(/[¥￥]?\s*([\d,]+(?:\.\d{1,2})?)/);if(m)return +(m[1].replace(/,/g,''))}}return null}
function parseText(text){const clean=text.replace(/[，]/g,',').replace(/\s+/g,' '),lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let date=iso(new Date());const dm=clean.match(/(20\d{2})[年\/.\-](\d{1,2})[月\/.\-](\d{1,2})日?/);if(dm)date=dm[1]+'-'+dm[2].padStart(2,'0')+'-'+dm[3].padStart(2,'0');const principal=amountNear(clean,['持有本金','当前本金','持仓金额','持有金额','投资金额','购买金额','本金']),earnings=amountNear(clean,['累计收益','持有收益','总收益','收益']);let value=amountNear(clean,['持有总金额','当前市值','持仓市值','总资产']);let name=lines.find(x=>/理财|产品|稳健|净值/.test(x)&&x.length>=4&&x.length<=45&&!/金额|收益|本金|详情/.test(x))||'';if(principal==null&&value!=null&&earnings!=null)of.principal.value=Math.max(0,value-earnings).toFixed(2);else of.principal.value=principal??'';of.earnings.value=earnings??'';of.value.value=value??'';of.date.value=date;of.name.value=name;return [name,principal,earnings,value].filter(x=>x!==null&&x!=='').length}
function refreshTargets(){target.innerHTML='<option value="new">新建理财项目</option>'+db.products.map(p=>'<option value="'+p.id+'">更新：'+esc(p.name)+'</option>').join('')}
document.querySelector('#ocrBtn').onclick=()=>{refreshTargets();of.reset();of.date.value=iso(new Date());preview.style.display='none';document.querySelector('#ocrText').value='';status.className='hint';status.textContent='截图仅在当前浏览器中识别。请选择清晰、完整的产品详情或持仓页面。';od.showModal()};
